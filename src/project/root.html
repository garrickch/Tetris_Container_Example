<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tetris Game Launcher</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>

        /* Resets Margins/Padding and Includes Borders in Element Sizing Calculations */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Titles Style */
        h1 {
            text-align: center;
            color: #4a90e2;
            padding-top: 20px;
        }

        /* Base Body Style */
        body {
            width: 100%;
            min-height: 100vh;
            /* overflow-x: hidden; */
            background-color: rgb(45, 11, 11);
        }

        /* Flex Container to hold the Links Horizontally */
        .image-row {
            display: flex;
            width: 100%;
            height: auto;
            padding-top: 20px;
            padding-right: 12.5%;
            padding-left: 12.5%;
            gap: 5%;
        }

        /* Each link shares the remaining row space equally */
        .image-link {
            flex: 1; 
            display: block;
            overflow: hidden;
            background-color: #4c4c4c;
            border: 8px solid #4a90e2;
            border-radius: 12px;
            padding: 15px;  
        }

        /* Make images fill their respective link containers */
        .image-link img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            transition: transform 0.3s ease;
        }

        /* When Mouse Cursor is Over Images Shrink the Image */
        .image-link:hover img {
            transform: scale(0.95);
        }
        
    </style>
</head>
<body>

    <!-- Title -->
    <h1>Tetris Game Launcher</h1>
    
    <!-- Image Row Container -->
    <div class="image-row">

        <!-- Board Image Link -->
        <a href="/board" class="image-link" target="_blank">
            <img src="/Images/WebDesign-SVG-Monitor.svg" alt="Link to Monitor">
        </a>

        <!-- Controller Image Link -->
        <a href="/controller" class="image-link" target="_blank">
            <img src="/Images/WebDesign-SVG-ArcadeController.svg" alt="Link to Controller">
        </a>
    </div>

</body>
</html>
