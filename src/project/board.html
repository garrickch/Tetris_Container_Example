<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tetris - Game Board</title>
    <style>

        /* Entire page setup */
        body {
            background-color: #111;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        /* Flexbox wrapper holding Left and Right panels side-by-side */
        .game-container {
            display: flex;
            align-items: flex-start;
            gap: 20px;
        }

        /* Vertical layout stack for the right side elements */
        .main-column {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Stylized Score Box at the top right */
        #score-board {
            background-color: #000;
            border: 4px solid #333;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
            box-sizing: border-box;
            height: 44px;
            width: 240px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 15px;
        }

        /* Text styles inside the score box */
        .score-label {
            font-size: 14px;
            font-weight: bold;
            color: #888;
            letter-spacing: 1px;
            line-height: 1;
        }

        #score {
            font-size: 20px;
            font-weight: bold;
            color: #00f0f0;
            font-family: 'Courier New', Courier, monospace;
            line-height: 1;
            transform: translateY(1px); 
        }

        /* Style for both canvases */
        canvas {
            border: 4px solid #333;
            background-color: #000;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
            display: block;
        }

    </style>
</head>
<body>

    <div class="game-container">
        <!-- Left Column: Preview -->
        <canvas id="preview" width="80" height="460"></canvas>
        
        <!-- Right Column: Score Box and Main Arena -->
        <div class="main-column">
            <div id="score-board">
                <div class="score-label">SCORE :</div>
                <span id="score">0</span>
            </div>
            <canvas id="tetris" width="240" height="400"></canvas>
        </div>
    </div>

<script>

// Declare Main Canvas Variables
const canvas = document.getElementById('tetris');
const context = canvas.getContext('2d');
context.scale(20, 20);

// New Preview Canvas Setup
const previewCanvas = document.getElementById('preview');
const pContext = previewCanvas.getContext('2d');
pContext.scale(20, 20); 
const scoreElement = document.getElementById('score');
let score = 0;

// Tetris Piece Shapes
const SHAPES = {
    'I': [[0,1,0,0],[0,1,0,0],[0,1,0,0],[0,1,0,0]],
    'L': [[0,2,0],[0,2,0],[0,2,2]],
    'J': [[0,3,0],[0,3,0],[3,3,0]],
    'O': [[4,4],[4,4]],
    'Z': [[5,5,0],[0,5,5],[0,0,0]],
    'S': [[0,6,6],[6,6,0],[0,0,0]],
    'T': [[0,7,0],[7,7,7],[0,0,0]]
};

// Control Colors of Each Shape
const COLORS = [
    null, '#00f0f0', '#f0a000', '#0000f0', '#f0f000', '#00f000', '#a000f0', '#f00000'
];

// Create Empty Board
function createMatrix(w, h) {
    const matrix = [];
    while (h--) { matrix.push(new Array(w).fill(0)); }
    return matrix;
}
const arena = createMatrix(12, 20);

// Declare Player
const player = {
    pos: {x: 0, y: 0},
    matrix: null
};

// Queue Array to hold next 5 shapes.
let previewQueue = [];

// Helper function to pick a random shape
function getRandomShape() {
    const pieces = 'ILJOZST';
    const key = pieces[pieces.length * Math.random() | 0];
    return JSON.parse(JSON.stringify(SHAPES[key]));
}

// At start fills previewQueue with 5 random pieces
function initQueue() {
    previewQueue = [];
    for (let i = 0; i < 5; i++) {
        previewQueue.push(getRandomShape());
    }
}

// Check for Collisions
function collide(arena, player) {
    const [m, o] = [player.matrix, player.pos];
    for (let y = 0; y < m.length; ++y) {
        for (let x = 0; x < m[y].length; ++x) {
            if (m[y][x] !== 0 && (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) {
                return true;
            }
        }
    }
    return false;
}

// Merge Piece into Board
function merge(arena, player) {
    player.matrix.forEach((row, y) => {
        row.forEach((value, x) => {
            if (value !== 0) {
                arena[y + player.pos.y][x + player.pos.x] = value;
            }
        });
    });
}

// Clear Completed Rows and Update Score
function arenaSweep() {
    let linesCleared = 0;
    outer: for (let y = arena.length - 1; y > 0; --y) {
        for (let x = 0; x < arena[y].length; ++x) {
            if (arena[y][x] === 0) { continue outer; }
        }
        const row = arena.splice(y, 1)[0].fill(0);
        arena.unshift(row);
        ++y;
        linesCleared += 1;
    }
    const pointValues = {
        1: 40,
        2: 90,
        3: 190,
        4: 300
    };
    if (linesCleared > 0) {
        score += pointValues[linesCleared];
    }
    scoreElement.innerText = score;
}

// Main Board Drawing logic
function drawMatrix(matrix, offset, ctx) {
    matrix.forEach((row, y) => {
        row.forEach((value, x) => {
            if (value !== 0) {
                ctx.fillStyle = COLORS[value];
                ctx.fillRect(x + offset.x, y + offset.y, 1, 1);
            }
        });
    });
}

// Renders the Preview Box
function drawPreview() {
    pContext.fillStyle = '#000';
    pContext.fillRect(0, 0, previewCanvas.width, previewCanvas.height);

    let absoluteMinY = Infinity;
    let absoluteMaxY = -Infinity;
    const piecesData = [];

    previewQueue.forEach((matrix, index) => {
        const slotYOffset = index * 4.5; 
        let minX = matrix.length, maxX = -1;
        let minY = matrix.length, maxY = -1;

        matrix.forEach((row, y) => {
            row.forEach((value, x) => {
                if (value !== 0) {
                    if (x < minX) minX = x;
                    if (x > maxX) maxX = x;
                    if (y < minY) minY = y;
                    if (y > maxY) maxY = y;
                }
            });
        });
        if (maxX === -1 || maxY === -1) return;

        const visualWidth = maxX - minX + 1;
        const visualHeight = maxY - minY + 1;
        const localXOffset = ((4 - visualWidth) / 2) - minX;
        const localYOffset = slotYOffset + ((4 - visualHeight) / 2) - minY;
        const localTop = localYOffset + minY;
        const localBottom = localYOffset + minY + visualHeight;
        
        if (localTop < absoluteMinY) absoluteMinY = localTop;
        if (localBottom > absoluteMaxY) absoluteMaxY = localBottom;
        piecesData.push({ matrix, xOffset: localXOffset, yOffset: localYOffset, slotYOffset });
    });

    const totalStackHeight = absoluteMaxY - absoluteMinY;
    const totalCanvasGridHeight = previewCanvas.height / 20; 
    const totalLeftoverSpace = totalCanvasGridHeight - totalStackHeight;
    const perfectGlobalYShift = (totalLeftoverSpace / 2) - absoluteMinY;

    piecesData.forEach((piece, index) => {
        const finalX = piece.xOffset;
        const finalY = piece.yOffset + perfectGlobalYShift;
        drawMatrix(piece.matrix, { x: finalX, y: finalY }, pContext);

        if (index < 4) {
            pContext.strokeStyle = 'rgba(255, 255, 255, 0.3)'; 
            pContext.lineWidth = 0.05; 
            pContext.beginPath();
            const lineY = piece.slotYOffset + 4.25 + perfectGlobalYShift;
            pContext.moveTo(0.5, lineY);
            pContext.lineTo(3.5, lineY);
            pContext.stroke();
        }
    });
}


// Creates: The Player's Board, The Arena's Board, and The Preview
function draw() {
    context.fillStyle = '#000';
    context.fillRect(0, 0, canvas.width, canvas.height);
    drawMatrix(arena, {x: 0, y: 0}, context);
    drawMatrix(player.matrix, player.pos, context);
    drawPreview();
}

// Change the Player's Position if able
function playerMove(dir) {
    player.pos.x += dir;
    if (collide(arena, player)) { player.pos.x -= dir; }
}

// Summon New Piece/Player from Queue and Reset if Necessary
function playerReset() {
    const nextMatrix = previewQueue.shift();
    player.matrix = JSON.parse(JSON.stringify(nextMatrix));
    
    previewQueue.push(getRandomShape());

    player.pos.y = 0;
    player.pos.x = (arena[0].length / 2 | 0) - (player.matrix[0].length / 2 | 0);
    
    if (collide(arena, player)) {
        arena.forEach(row => row.fill(0));
        score = 0;
        scoreElement.innerText = score;
        initQueue();
    }
}

// Lowers Player's Position One Grid if Able
function playerDrop() {
    player.pos.y++;
    if (collide(arena, player)) {
        player.pos.y--;
        merge(arena, player);
        playerReset();
        arenaSweep();
    }
    dropCounter = 0;
}

// Drops Player's Position to Lowest Spot
function playerHardDrop() {
    let rowsDropped = -1;
    while (!collide(arena, player)) {
        rowsDropped++;
        player.pos.y++;
    }
    player.pos.y--;
    merge(arena, player);
    playerReset();
    arenaSweep();
    dropCounter = 0;
    score += Math.max(0, rowsDropped);
    scoreElement.innerText = score; 
}

// Handle Rotation Logic
function rotate(matrix, dir) {
    for (let y = 0; y < matrix.length; ++y) {
        for (let x = 0; x < y; ++x) {
            [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
        }
    }
    if (dir > 0) { matrix.forEach(row => row.reverse()); } 
    else { matrix.reverse(); }
}

// Attempts the Player's Rotation Logic independently without altering the queue
function playerRotate(dir) {
    const pos = player.pos.x;
    let offset = 1;
    rotate(player.matrix, dir);
    while (collide(arena, player)) {
        player.pos.x += offset;
        offset = -(offset + (offset > 0 ? 1 : -1));
        if (offset > player.matrix[0].length) {
            rotate(player.matrix, -dir);
            player.pos.x = pos;
            return;
        }
    }
}

let dropCounter = 0;
let dropInterval = 1000; // Equivalent to One Second
let lastTime = 0;

// Recursive Update Loop
function update(time = 0) {
    const deltaTime = time - lastTime;
    lastTime = time;
    dropCounter += deltaTime;
    
    if (dropCounter > dropInterval) { playerDrop(); }
    draw();
    requestAnimationFrame(update);
}

// Initial Function Calls
initQueue();
playerReset();
update();

const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
const ws = new WebSocket(`${wsProtocol}//${window.location.host}/ws/board`);

// Handle Messages From Servers
ws.onmessage = (event) => {
    const message = JSON.parse(event.data);
    const command = message.action;
    
    if (command === 'ArrowLeft')  playerMove(-1);
    if (command === 'ArrowRight') playerMove(1);
    if (command === 'ArrowDown')  playerDrop();
    if (command === 'ArrowUp')    playerRotate(1);
    if (command === ' ')          playerHardDrop();
};

// Handle when Disconnected from Server
ws.onclose = () => console.log("Disconnected from Python message broker.");

</script>
</body>
</html>
